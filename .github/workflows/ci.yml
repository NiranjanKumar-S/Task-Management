name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify application build & endpoints
      run: |
        python -c "from app import app, db, Task; client = app.test_client(); res = client.get('/dashboard'); assert res.status_code == 200; res2 = client.get('/api/statistics'); assert res2.status_code == 200; print('CI checks passed!')"
